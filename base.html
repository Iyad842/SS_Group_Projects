<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='hexagon.ico') }}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SecureVault{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --border:   #1e1e2e;
      --accent:   #00ff9d;
      --accent2:  #7c3aed;
      --danger:   #ff3b5c;
      --warn:     #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --mono:     'Space Mono', monospace;
      --display:  'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,58,237,0.15) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,30,46,0.4) 39px, rgba(30,30,46,0.4) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,30,46,0.4) 39px, rgba(30,30,46,0.4) 40px);
    }

    /* ── Navbar ── */
    nav {
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px;
    }
    .nav-brand {
      font-family: var(--display);
      font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em;
      color: var(--accent); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-brand::before {
      content: "⬡";
      font-size: 1.3rem;
    }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; }
    .nav-links a, .nav-links form button {
      color: var(--muted); text-decoration: none;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 6px 14px; border-radius: 4px;
      border: none; background: none; cursor: pointer; font-family: var(--mono);
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover, .nav-links form button:hover { color: var(--text); background: var(--border); }
    .nav-links a.active { color: var(--accent); }
    .badge-admin {
      background: rgba(124,58,237,0.2); color: #a78bfa;
      border: 1px solid rgba(124,58,237,0.4);
      font-size: 10px; padding: 2px 8px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-family: var(--display); font-weight: 800; font-size: 2rem;
      letter-spacing: -0.03em; line-height: 1.1;
    }
    .page-header p { color: var(--muted); margin-top: 0.5rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: rgba(0,255,157,0.2); }
    .card-title {
      font-family: var(--display); font-weight: 700; font-size: 1rem;
      margin-bottom: 1rem; color: var(--text);
    }

    /* ── Forms ── */
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: 5px;
      color: var(--text); font-family: var(--mono); font-size: 14px;
      padding: 10px 14px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,255,157,0.08);
    }
    textarea { resize: vertical; min-height: 100px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 20px; border-radius: 5px; border: none;
      cursor: pointer; font-family: var(--mono); font-size: 12px;
      font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent); color: #000;
    }
    .btn-primary:hover { background: #00e08a; box-shadow: 0 0 20px rgba(0,255,157,0.3); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
    .btn-danger {
      background: transparent; color: var(--danger);
      border: 1px solid rgba(255,59,92,0.3);
    }
    .btn-danger:hover { background: rgba(255,59,92,0.1); }
    .btn-sm { padding: 5px 12px; font-size: 11px; }
    .btn-purple {
      background: var(--accent2); color: #fff;
    }
    .btn-purple:hover { background: #6d28d9; }

    /* ── Alerts / Flash ── */
    .alerts { margin-bottom: 1.5rem; }
    .alert {
      padding: 10px 16px; border-radius: 5px; font-size: 13px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
      border-left: 3px solid;
    }
    .alert-success { background: rgba(0,255,157,0.06); border-color: var(--accent); color: #6ee7b7; }
    .alert-error   { background: rgba(255,59,92,0.06); border-color: var(--danger); color: #fca5a5; }
    .alert-warning { background: rgba(245,158,11,0.06); border-color: var(--warn); color: #fcd34d; }
    .alert-info    { background: rgba(124,58,237,0.06); border-color: var(--accent2); color: #a78bfa; }

    /* ── Grids ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }
    @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); padding: 10px 14px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(30,30,46,0.6); font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ── Note card ── */
    .note-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.2rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      transition: border-color 0.2s;
    }
    .note-card:hover { border-color: rgba(0,255,157,0.15); }
    .note-title { font-family: var(--display); font-weight: 700; font-size: 0.95rem; }
    .note-content {
      font-size: 13px; color: var(--muted); line-height: 1.6;
      background: var(--bg); border-radius: 4px; padding: 10px;
      border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word;
    }
    .note-meta { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }
    .lock-icon { color: var(--accent); font-size: 11px; }

    /* ── Stat cards ── */
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    .stat-value { font-family: var(--display); font-weight: 800; font-size: 2.5rem; color: var(--accent); }

    /* ── Auth pages ── */
    .auth-wrap {
      min-height: calc(100vh - 56px);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .auth-box {
      width: 100%; max-width: 420px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 2.5rem;
    }
    .auth-logo {
      font-family: var(--display); font-weight: 800; font-size: 1.5rem;
      color: var(--accent); text-align: center; margin-bottom: 2rem;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .auth-logo::before { content: "⬡"; font-size: 1.8rem; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 12px; color: var(--muted); }
    .auth-footer a { color: var(--accent); text-decoration: none; }

    /* ── Role badges ── */
    .role-admin { color: #a78bfa; background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3); padding: 2px 8px; border-radius: 3px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .role-user  { color: var(--muted); background: rgba(100,116,139,0.1); border: 1px solid rgba(100,116,139,0.2); padding: 2px 8px; border-radius: 3px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }

    /* ── Error pages ── */
    .error-wrap {
      min-height: calc(100vh - 56px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
      text-align: center;
    }
    .error-code { font-family: var(--display); font-size: 8rem; font-weight: 800; color: var(--border); line-height: 1; }
    .error-msg { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="{{ url_for('index') }}">SecureVault</a>
  <div class="nav-links">
    {% if session.user_id %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      {% if session.role == 'admin' %}
        <a href="{{ url_for('admin_panel') }}"><span class="badge-admin">⚙ Admin</span></a>
      {% endif %}
      <span style="color:var(--muted); padding: 0 8px; font-size:11px;">{{ session.username }}</span>
      <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </div>
</nav>

{% block body %}{% endblock %}

</body>
</html>
